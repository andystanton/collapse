<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Collapse</title>

    <script type="module">
        import { COLLAPSE } from '@/main.ts';

        function initCollapse() {
            async function collapseTarget() {
                const collapseBtn = document.getElementById('collapse');
                collapseBtn.disabled = true;
                collapseBtn.removeEventListener('click', collapseTarget);

                const targets = document.querySelectorAll('.collapse-target');
                const promises = Array.from(targets).map(async (element) => {
                    try {
                        const collapsed = await COLLAPSE.collapse(element);
                        COLLAPSE.KICK.AwayFromElement(collapsed);
                    } catch (error) {
                        console.warn(error);
                    }
                });

                await Promise.all(promises);
            }

            COLLAPSE.configure({
                loop: COLLAPSE.SYSTEM.BigBangBigCrunch,
                oncomplete: function() {
                    const collapseBtn = document.getElementById('collapse');
                    collapseBtn.disabled = false;
                    collapseBtn.addEventListener('click', collapseTarget);
                },
                chunkSize: 4,
            }).then(() => {
                document.addEventListener('keydown', function(e) {
                    if (e.ctrlKey && e.key === 'r') {
                        e.preventDefault();
                        console.log('reset');
                        COLLAPSE.reset();
                    }
                });

                document.getElementById('collapse').addEventListener('click', collapseTarget);
            });
        }

        document.addEventListener("DOMContentLoaded", initCollapse);
    </script>
</head>

<body role="document">

    <div class="site-wrapper">

        <div class="site-wrapper-inner">

            <div class="cover-container">

                <div class="inner cover">
                    <h1 class="cover-heading">Collapse</h1>

                    <p>DOM -> pixels -> WebGL.</p>

                    <div class="mb-3">
                        <textarea class="collapse-target form-control form-control-lg" rows="3" placeholder="Enter some text"></textarea>
                    </div>
                    <div class="d-flex flex-wrap justify-content-center gap-2">
                        <button type="button" class="btn btn-default collapse-target">Default</button>
                        <button type="button" class="btn btn-primary collapse-target">Primary</button>
                        <button type="button" class="btn btn-success collapse-target">Success</button>
                        <button type="button" class="btn btn-info collapse-target">Info</button>
                        <button type="button" class="btn btn-warning collapse-target">Warning</button>
                        <button type="button" class="btn btn-danger collapse-target">Danger</button>
                    </div>
                    <br/>

                    <p><a class="btn btn-lg btn-default" role="button" id="collapse">Break things</a></p>
                </div>

                <div class="mastfoot">
                    <div class="inner">
                        <p><a href="https://github.com/andystanton/collapse">Collapse</a> by <a href="https://andy.stanton.is/">Andy Stanton</a>.</p>
                    </div>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
